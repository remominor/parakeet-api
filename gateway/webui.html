<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parakeet Transcription</title>
<style>:root{color-scheme:dark}body{max-width:860px;margin:2rem auto;padding:0 1rem;font:16px system-ui;background:#101418;color:#e7edf3}h1,h2{color:#f7f9fc}#drop{border:2px dashed #60758a;background:#182029;padding:2rem;text-align:center;border-radius:10px;color:#b9c7d4}input{color:#dce6ef}button{padding:.48rem .85rem;margin:.4rem 0;border:1px solid #405366;border-radius:6px;background:#213244;color:#e7edf3;cursor:pointer}button:hover{background:#2c455d}button:disabled{opacity:.5;cursor:not-allowed}audio{width:100%;filter:invert(.88) hue-rotate(180deg)}#status,#confidence{color:#aebdca}#words button{border:0;background:none;padding:3px;color:#c9e1f7}#words button:hover{background:#263a4d}#words .low{background:#693c1e;color:#ffe4b5;border-radius:3px}pre{white-space:pre-wrap;background:#182029;border:1px solid #273746;border-radius:8px;padding:1rem;color:#e7edf3}small{color:#8fa2b2}
</style>
<h1>Parakeet Transcription</h1><p><label>API key <input id="key" type="password" autocomplete="off" placeholder="Optional"></label></p><div id="drop">Drop audio here or <input id="file" type="file" accept="audio/*"></div>
<p><button id="record">Record microphone</button> <button id="run" disabled>Transcribe</button> <button id="again" disabled>Re-run</button></p>
<audio id="audio" controls></audio><p id="status"></p><h2>Transcript</h2><pre id="text"></pre><p id="confidence"></p><div id="words"></div>
<p><button data-export="txt">Export TXT</button> <button data-export="json">Export JSON</button> <button data-export="srt">Export SRT</button> <button data-export="vtt">Export VTT</button></p>
<script>
let file,result,recording=[],recorder;const $=id=>document.getElementById(id),status=$('status');$('key').value=sessionStorage.getItem('parakeet-api-key')||'';$('key').oninput=()=>sessionStorage.setItem('parakeet-api-key',$('key').value);
function load(f){file=f;$('audio').src=URL.createObjectURL(f);$('run').disabled=false;$('again').disabled=false;status.textContent=f.name}
$('file').onchange=e=>load(e.target.files[0]);$('drop').ondragover=e=>e.preventDefault();$('drop').ondrop=e=>{e.preventDefault();load(e.dataTransfer.files[0])};
$('record').onclick=async()=>{if(recorder){recorder.stop();return}let s=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(s);recording=[];recorder.ondataavailable=e=>recording.push(e.data);recorder.onstop=()=>{load(new File(recording,'recording.webm',{type:recorder.mimeType}));recorder=null;$('record').textContent='Record microphone'};recorder.start();$('record').textContent='Stop recording'};
async function run(){if(!file)return;status.textContent='Transcribing…';let fd=new FormData;fd.append('file',file);fd.append('model','parakeet');fd.append('response_format','verbose_json');fd.append('timestamp_granularities[]','word');let key=$('key').value.trim(),headers=key?{'X-API-Key':key}:{};let r=await fetch('/v1/audio/transcriptions',{method:'POST',body:fd,headers});if(!r.ok){status.textContent=await r.text();return}result=await r.json();$('text').textContent=result.text;let c=(result.words||[]).map(w=>w.conf??w.confidence).filter(x=>x!=null);$('confidence').textContent=c.length?`Confidence: mean ${(c.reduce((a,b)=>a+b,0)/c.length).toFixed(3)}, min ${Math.min(...c).toFixed(3)}, low words ${c.filter(x=>x<.7).length}`:'';$('words').innerHTML='';for(let w of result.words||[]){let b=document.createElement('button');b.textContent=w.word+' ';b.className=(w.conf??w.confidence??1)<.7?'low':'';b.onclick=()=>{$('audio').currentTime=w.start;$('audio').play()};$('words').append(b)}status.textContent=`Engine: ${r.headers.get('X-Parakeet-Engine-Ms')} ms · Total: ${r.headers.get('X-Parakeet-Total-Ms')} ms`}
$('run').onclick=run;$('again').onclick=run;document.querySelectorAll('[data-export]').forEach(b=>b.onclick=()=>{if(!result)return;let kind=b.dataset.export,content=kind==='txt'?result.text:kind==='json'?JSON.stringify(result,null,2):subtitle(kind),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type:'text/plain'}));a.download='transcript.'+kind;a.click()});
function subtitle(kind){let s=kind==='vtt'?'WEBVTT\n\n':'';for(let [i,x] of (result.segments||[]).entries())s+=(kind==='srt'?i+1+'\n':'')+stamp(x.start,kind==='srt')+' --> '+stamp(x.end,kind==='srt')+'\n'+x.text+'\n\n';return s}function stamp(n,c){let ms=Math.round(n*1000),h=Math.floor(ms/3600000);ms%=3600000;let m=Math.floor(ms/60000);ms%=60000;let s=Math.floor(ms/1000);return [h,m,s].map(x=>String(x).padStart(2,'0')).join(':')+(c?',':'.')+String(ms%1000).padStart(3,'0')}
</script>
